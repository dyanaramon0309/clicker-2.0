<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #menuLateral.active {
            right: 0 !important;
        }

        body {
            background-color: #D2B48C;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #contador-container {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #5C4033;
            margin-top: 20px;
        }

        .botonGalleta {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            border: none;
            cursor: pointer;
            background-image: url("https://static.vecteezy.com/system/resources/previews/055/163/167/non_2x/delicious-cartoon-illustration-of-a-loaf-of-bread-free-vector.jpg");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            transition: transform 0.1s ease;
            transform: translate(-50%, -50%);
        }
        .botonGalleta:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
    </style>
</head>

<body>

    <div id="contador-container">Panes: <span id="contador">0</span></div>

    <button type="button" id="toggleMenu" style="position: absolute; top: 20px; right: 20px; font-size: 20px; padding: 10px 15px; background-color: #8B4513; color: white; border: none; cursor: pointer; border-radius: 5px; z-index: 10;">☰ Menú</button>
    
    <div id="menuLateral" style="position: fixed; top: 0; right: -250px; width: 250px; height: 100%; background-color: #5C4033; color: white; transition: right 0.3s ease; box-shadow: -2px 0px 10px rgba(0,0,0,0.5); z-index: 9; padding-top: 80px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
        <button type="button" id="btnMejora1" style="width: 85%; padding: 12px; background-color: #8B4513; color: white; border: 1px solid #E6D7C3; border-radius: 5px; cursor: pointer; font-size: 16px;">Mejora 1</button>
        <button type="button" id="btnMejora2" style="width: 85%; padding: 12px; background-color: #8B4513; color: white; border: 1px solid #E6D7C3; border-radius: 5px; cursor: pointer; font-size: 16px;">Mejora 2</button>
    </div>

    <button type="button" class="botonGalleta"></button>


    <script src="script.js"></script>
</body>
</html>
